# ═══════════════════════════════════════════════════════════════════
# TeleNOC AI - Docker Compose
# OPEA microservices + Custom Backend + UI Dashboard
# ═══════════════════════════════════════════════════════════════════
#
# OPEA Components (from GenAIExamples/ChatQnA):
#   tei-embedding-service      →   Text Embeddings Inference (CPU)
#   retriever                   →   Redis-backed semantic search
#   chatqna-xeon-backend-server →   RAG pipeline orchestration
#
# Custom Components:
#   telenoc-backend             →   FastAPI + Agent Logic
#   telenoc-ui                  →   NGINX + HTML Dashboard
#
# Architecture:
#   User → UI → Backend → OPEA ChatQnA → Retriever → TEI Embedding
#                                   → ChromaDB (local vector store)
#                                   → NVIDIA/Groq/HF/Ollama (LLM API)
#
# Requirements:
#   - 4-core CPU, 8GB RAM minimum, no GPU required
#   - Docker & Docker Compose
# ═══════════════════════════════════════════════════════════════════

version: "3.8"

services:
  # ─── Redis Vector DB (for OPEA Retriever) ────────────────────────────────
  redis-vector-db:
    image: redis/redis-stack:7.2.0-v9
    container_name: telenoc-redis
    ports:
      - "6379:6379"
      - "8002:8001"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - telenoc_network

  # ─── TEI Embedding Service (CPU) ───────────────────────────────────────
  tei-embedding-service:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    container_name: telenoc-tei
    ports:
      - "6006:80"
    volumes:
      - tei_data:/data
    shm_size: 1g
    command: --model-id BAAI/bge-small-en-v1.5 --auto-truncate
    networks:
      - telenoc_network

  # ─── OPEA Retriever (Redis-backed) ────────────────────────────────────
  retriever:
    image: opea/retriever:latest
    container_name: telenoc-retriever
    depends_on:
      - redis-vector-db
    ports:
      - "7000:7000"
    ipc: host
    environment:
      REDIS_URL: redis://redis-vector-db:6379
      REDIS_HOST: redis-vector-db
      INDEX_NAME: telecom-knowledge-base
      TEI_EMBEDDING_ENDPOINT: http://tei-embedding-service:80
      RETRIEVER_COMPONENT_NAME: "TELENOC_RETRIEVER"
      LOGFLAG: "True"
    networks:
      - telenoc_network

  # ─── OPEA Data Preparation Service ────────────────────────────────────
  dataprep-redis-service:
    image: opea/dataprep:latest
    container_name: telenoc-dataprep
    depends_on:
      redis-vector-db:
        condition: service_healthy
      tei-embedding-service:
        condition: service_started
    ports:
      - "6007:5000"
    environment:
      REDIS_URL: redis://redis-vector-db:6379
      REDIS_HOST: redis-vector-db
      INDEX_NAME: telecom-knowledge-base
      TEI_ENDPOINT: http://tei-embedding-service:80
      TEI_EMBEDDING_ENDPOINT: http://tei-embedding-service:80
    networks:
      - telenoc_network

  # ─── OPEA ChatQnA Backend (RAG Pipeline) ─────────────────────────────
  chatqna-backend:
    image: opea/chatqna:latest
    container_name: telenoc-chatqna
    depends_on:
      - redis-vector-db
      - tei-embedding-service
      - retriever
    ports:
      - "8888:8888"
    environment:
      MEGA_SERVICE_HOST_IP: chatqna-backend
      EMBEDDING_SERVER_HOST_IP: tei-embedding-service
      EMBEDDING_SERVER_PORT: 80
      RETRIEVER_SERVICE_HOST_IP: retriever
      LLM_SERVER_HOST_IP: ollama
      LLM_SERVER_PORT: 11434
      LLM_MODEL: llama2
      LOGFLAG: "True"
    ipc: host
    networks:
      - telenoc_network

  # ─── ChromaDB (Local Vector Store for Backend) ─────────────────────────
  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: telenoc-chromadb
    ports:
      - "8001:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma_data
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadb_data:/chroma/chroma_data
    networks:
      - telenoc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/collections"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Ollama (Local LLM Fallback) ──────────────────────────────────────
  # Uses host network mode to access existing Ollama instance on localhost:11434
  # or runs as a container if no existing Ollama is detected
  ollama:
    image: ollama/ollama:latest
    container_name: telenoc-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - telenoc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Note: If running this alongside a host Ollama on 11434, 
    # the backend will use the host Ollama via OLLAMA_HOST=http://host.docker.internal:11434

  # ─── Backend (FastAPI + Custom Agent Logic) ───────────────────────────
  telenoc-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telenoc-backend
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # AI Provider Keys (NVIDIA primary, others fallback)
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HF_API_KEY: ${HF_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-nvidia}
      # OPEA Service URLs
      OPEA_EMBEDDING_URL: http://tei-embedding-service:80
      OPEA_RETRIEVER_URL: http://retriever:7000
      OPEA_CHATQNA_URL: http://chatqna-backend:8888
      # Ollama Fallback
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama2}
      # Database
      TELENOC_DB_PATH: /data/telenoc.db
      # Backend Config
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: 1
    volumes:
      - ./data:/data
      - ./backend:/app/backend
    depends_on:
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - telenoc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── UI (NGINX for HTML Dashboard) ─────────────────────────────────────
  telenoc-ui:
    image: nginx:alpine
    container_name: telenoc-ui
    ports:
      - "8080:80"
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - telenoc-backend
    networks:
      - telenoc_network

volumes:
  tei_data:
  chromadb_data:
  ollama_data:

networks:
  telenoc_network:
    driver: bridge