version: "3.8"

services:
  # ─── ChromaDB Vector Store ────────────────────────────────────────────────
  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: chromadb-telenoc
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma_data
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chromadb_data:/chroma/chroma_data
    networks:
      - telenoc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/collections"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Ollama (Local LLM Fallback) ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-telenoc
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - telenoc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (FastAPI) ────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: backend-telenoc
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - HF_API_KEY=${HF_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-nvidia}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama2}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - TELENOC_DB_PATH=/data/telenoc.db
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    volumes:
      - ../data:/data
      - ../backend:/app/backend
      - ../services:/app/services
      - ../ui:/app/ui
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - telenoc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── UI (NGINX for HTML Dashboard) ────────────────────────────────────────
  ui:
    image: nginx:alpine
    container_name: ui-telenoc
    ports:
      - "8080:80"
    volumes:
      - ../ui:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - telenoc_network

volumes:
  chromadb_data:
  ollama_data:

networks:
  telenoc_network:
    driver: bridge