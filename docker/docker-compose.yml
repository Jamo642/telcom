services:
  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis-telenoc
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    mem_limit: 256m
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - telenoc_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── OPEA Embedding Service (optional — profile=opea) ────────────────────
  embedding:
    image: opea/embedding-tei:latest
    container_name: embedding-telenoc
    profiles: ["opea"]
    mem_limit: 2g
    environment:
      - PORT=6000
    ports:
      - "6000:6000"
    networks:
      - telenoc_network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:6000/metrics')\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─── OPEA Retriever Service (optional — profile=opea) ────────────────────
  retriever:
    image: opea/retriever-redis:latest
    container_name: retriever-telenoc
    profiles: ["opea"]
    mem_limit: 2g
    environment:
      - REDIS_URL=redis://redis:6379
      - EMBEDDING_SERVICE_HOST=embedding
      - EMBEDDING_SERVICE_PORT=6000
      - PORT=7000
    ports:
      - "7000:7000"
    depends_on:
      redis:
        condition: service_healthy
      embedding:
        condition: service_healthy
    networks:
      - telenoc_network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:7000/metrics')\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─── OPEA Data Preparation Service (optional — profile=opea) ─────────────
  dataprep:
    image: opea/dataprep:latest
    container_name: dataprep-telenoc
    profiles: ["opea"]
    mem_limit: 2g
    environment:
      - PORT=6007
      - EMBEDDING_SERVICE_HOST=embedding
      - EMBEDDING_SERVICE_PORT=6000
      - REDIS_URL=redis://redis:6379
    ports:
      - "6007:6007"
    depends_on:
      redis:
        condition: service_healthy
      embedding:
        condition: service_healthy
    networks:
      - telenoc_network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:6007/metrics')\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─── OPEA ChatQnA Orchestrator (optional — profile=opea) ─────────────────
  chatqna:
    image: opea/chatqna:latest
    container_name: chatqna-telenoc
    profiles: ["opea"]
    mem_limit: 2g
    environment:
      - PORT=8888
      - RETRIEVER_SERVICE_HOST=retriever
      - RETRIEVER_SERVICE_PORT=7000
      - DATAPREP_SERVICE_HOST=dataprep
      - DATAPREP_SERVICE_PORT=6007
      - EMBEDDING_SERVICE_HOST=embedding
      - EMBEDDING_SERVICE_PORT=6000
      - REDIS_URL=redis://redis:6379
    ports:
      - "8888:8888"
    depends_on:
      retriever:
        condition: service_healthy
      dataprep:
        condition: service_healthy
      embedding:
        condition: service_healthy
    networks:
      - telenoc_network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8888/metrics')\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─── Ollama (Local LLM Fallback — only starts when profile=ollama) ────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-telenoc
    profiles: ["ollama"]
    mem_limit: 4g
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - telenoc_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─── Backend (FastAPI) ────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: backend-telenoc
    mem_limit: 1g
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - HF_API_KEY=${HF_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama2}
      - EMBEDDING_SERVICE_HOST=embedding
      - EMBEDDING_SERVICE_PORT=6000
      - RETRIEVER_SERVICE_HOST=retriever
      - RETRIEVER_SERVICE_PORT=7000
      - DATAPREP_SERVICE_HOST=dataprep
      - DATAPREP_SERVICE_PORT=6007
      - CHATQNA_SERVICE_HOST=chatqna
      - CHATQNA_SERVICE_PORT=8888
      - TEI_EMBEDDING_ENDPOINT=http://embedding:6000
      - REDIS_URL=redis://redis:6379
      - TELENOC_DB_PATH=/data/telenoc.db
      - CHROMA_DB_PATH=/data/chroma_db
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    volumes:
      - ../data:/data
      - ../backend:/app/backend
      - ../services:/app/services
      - ../ui:/app/ui
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - telenoc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─── UI (NGINX) ───────────────────────────────────────────────────────────
  ui:
    image: nginx:alpine
    container_name: ui-telenoc
    mem_limit: 128m
    ports:
      - "8080:80"
    volumes:
      - ../ui:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - telenoc_network

volumes:
  redis_data:
  ollama_data:

networks:
  telenoc_network:
    driver: bridge
